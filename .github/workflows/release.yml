name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Tag matches Cargo.toml, tests pass
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Tag is the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - name: Test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          cargo test --release --locked
      - name: The crate packages
        run: cargo publish --dry-run --locked

  binaries:
    name: ${{ matrix.target }}
    needs: check
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="zit-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/zit target/${{ matrix.target }}/release/git-zit LICENSE README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: zit-*.tar.gz*

  release:
    name: GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Zit $version" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag pushed again (after a history rewrite, say) keeps the release it has:
        # published binaries and checksums are never replaced.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; its assets are left as published"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Zit ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  crate:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::No CARGO_REGISTRY_TOKEN secret: the crate was not published"
            exit 0
          fi
          if cargo search zit --limit 1 | grep -q "^zit = \"${GITHUB_REF_NAME#v}\""; then
            echo "zit ${GITHUB_REF_NAME#v} is already on crates.io"
            exit 0
          fi
          cargo publish --locked
